<!DOCTYPE html>
<html>
<head>
    <title>Article Admin</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .hidden { display: none; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #0066cc; color: white; padding: 10px 20px; border: none; cursor: pointer; }
        button:hover { background: #0052a3; }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginSection">
        <h1>Admin Login</h1>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <div id="error" style="color: red;"></div>
    </div>

    <!-- Admin Section -->
    <div id="adminSection" class="hidden">
        <h1>Add Article</h1>
        <p>Logged in as: <span id="userEmail"></span> | <button onclick="logout()">Logout</button></p>
        
        <input type="text" id="title" placeholder="Title">
        <select id="category">
            <option value="news">News</option>
            <option value="sports">Sports</option>
            <option value="arts">Arts & Culture</option>
        </select>
        <input type="text" id="author" placeholder="Author">
        <textarea id="content" placeholder="Content" rows="10"></textarea>
        <button onclick="addArticle()">Add Article</button>
        <div id="message"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const db = firebase.firestore();
        let currentUser = null;

        // Check login state
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.remove('hidden');
                document.getElementById('userEmail').textContent = user.email;
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('adminSection').classList.add('hidden');
            }
        });

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                document.getElementById('error').textContent = '';
            } catch (error) {
                document.getElementById('error').textContent = error.message;
            }
        }

        function logout() {
            firebase.auth().signOut();
        }

        async function addArticle() {
            if (!currentUser) {
                alert('Please login first');
                return;
            }

            const article = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                author: document.getElementById('author').value,
                content: document.getElementById('content').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                createdBy: currentUser.uid
            };

            try {
                await db.collection('articles').add(article);
                document.getElementById('message').innerHTML = '<p style="color: green;">Article added successfully!</p>';
                // Clear form
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
                document.getElementById('author').value = '';
            } catch (error) {
                document.getElementById('message').innerHTML = '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
